<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Game Scores</title>
    <link rel="stylesheet" href="css/scores.css"> <!-- You can add custom styling -->
    <style>
        body {
            background-image: url('res/scores_bg.webp'); /* Path to your downloaded image */
            background-size: cover; /* Ensure the background covers the whole page */
            background-repeat: no-repeat; /* The background should not repeat */
            background-attachment: fixed; /* The background should not scroll with the page */
        }
    </style>
    <script src="js/scores.js" defer></script> <!-- Your JavaScript code -->
</head>
<body>
    <div id="header">
        <button id="backButton">Retour</button>
        <div id="yearSelector" class="year-navigation">
            <button id="prevYear">&lt;</button>
            <span id="currentYear"></span>
            <button id="nextYear">&gt;</button>
        </div>
    </div>
    <table id="summaryTable" class="summary-table">
        <!-- Table will be filled by JavaScript -->
    </table>
    <h2>Toutes les parties</h2>
    <div id="monthlyScores">
        <!-- Monthly scores will be filled by JavaScript -->
    </div>
</body>
</html>
