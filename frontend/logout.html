<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logout</title>
</head>
<body>
  <h1>You are being logged out...</h1>
  
  <script>
    // Clear localStorage
    localStorage.removeItem('token');
    localStorage.removeItem('username');
    
    // Redirect to the login page
    window.location.href = '/index.html';
  </script>
</body>
</html>
