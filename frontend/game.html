<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whist International Championship</title>
    <link id="my-stylesheet" rel="stylesheet" href="css/game-styles.css" />
    <link rel="icon" type="image/png" href="/res/favicon.png" />
  </head>
  <body>
    <div class="game-container">
      <div class="upper-row">
        <div class="player1-zone" id="player1-zone">
          <div class="player-info">
            <img src="res/jerome.jpeg" alt="Player 1" class="player-image" width="62.5" height="80" id="player1-image"/>
            <img src="res/first_to_start.jpeg" class="first-to-start-image" id="player1-first-to-start"/>
            <div class="player-stats">
              <div class="player-bet" id="player1-bet"></div>
              <div class="player-tricks" id="player1-tricks"></div>
            </div>
          </div>
          <div class="player-cards small-cards" id="player1-cards"></div>
        </div>
        <div class="central-area">
        <div class="archive-container">
          <button id="archive-scores">Scores</button>
          <button id="Logout">Logout</button>
        </div>
        <div class="middle-row" id="game-area">
            <div class="game-status">
              <div class="game-info">
                  <div class="trump-card" id="trump-card"></div>
                  <table class="scores-table">
                    <thead>
                      <tr>
                        <th>Round</th>
                        <th id="player1-header">Player1</th>
                        <th id="player2-header">Player2</th>
                        <th id="player3-header">Player3</th>
                        <th id="mises-header">Mises</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td id="round-number"></td>
                        <td id="player1-score"></td>
                        <td id="player2-score"></td>
                        <td id="player3-score"></td>
                        <td id="mises-score"></td>
                      </tr>
                    </tbody>
                  </table>
                  <div class="deck-container" id="deck-container"> <!-- New container for deck of cards -->
                    <!-- Add your deck of cards here -->
                  </div>
                </div>
                <div class="trick-cards" id="trick-cards"></div>
              </div>
            </div>
            <div id="choose-trump" style="display: none; position: relative; width: 50%; margin: 0 auto;">
            <img class="trump-option" src="res/hearts_2.svg" alt="2 of hearts" data-suit="hearts" data-rank="2" />
              <img class="trump-option" src="res/spades_2.svg" alt="2 of spades" data-suit="spades" data-rank="2" />
              <img class="trump-option" src="res/diamonds_2.svg" alt="2 of diamonds" data-suit="diamonds" data-rank="2" />
              <img class="trump-option" src="res/clubs_2.svg" alt="2 of clubs" data-suit="clubs" data-rank="2" />
            </div>
            <div id="bet-selection" class="bet-selection"></div>
            <div class="game-controls">
              <button id="game-button" disabled>Nouvelle partie</button>
            </div>
        </div>
        <div class="player2-zone" id="player2-zone">
          <div class="player-info">
            <img src="res/audrey.jpeg" alt="Player 1" class="player-image" width="62.5" height="80" id="player2-image"/>
            <img src="res/first_to_start.jpeg" class="first-to-start-image" id="player2-first-to-start"/>
            <div class="player-stats">
              <div class="player-bet" id="player2-bet"></div>
              <div class="player-tricks" id="player2-tricks"></div>
            </div>
          </div>
          <div class="player-cards small-cards" id="player2-cards"></div>
        </div>
      </div>
      <div class="bottom-row">
        <div class="player-zone" id="player3-zone">
          <div class="player-info">
            <div class="player-images">
              <img src="res/tony.jpeg" alt="Player 3" class="player-image" width="62.5" height="80" id="player3-image" />
              <img src="res/first_to_start.jpeg" class="first-to-start-image" id="player1-first-to-start" />
              <div class="player-stats">
                <div class="player-bet" id="player3-bet"></div>
                <div class="player-tricks" id="player3-tricks"></div>
              </div>
            </div>
            <div class="player-cards main-player" id="player3-cards"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="lastTrickModal" class="modal">
      <div class="modal-content">
        <span class="modal-title" style="text-align:center;display:block">Dernier pli</span>
        <div id="lastTrickCards" class="card-container">
          <!-- Cards will be appended here -->
        </div>
      </div>
    </div>
    <div id="roundsModal" style="display:none;">
      <div id="roundsTable"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.0/socket.io.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
  </body>
  </html>
